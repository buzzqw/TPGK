[project]
name = "tpgk"
version = "1.1.0"
description = "A GTK3/VTE terminal emulator with AI integration"
requires-python = ">=3.10"
dependencies = [
    "PyGObject",
    "requests",
    "psutil",
]

[project.scripts]
tpgk = "tpgk.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # Pyflakes
    "B",         # flake8-bugbear
    "I",         # isort
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
