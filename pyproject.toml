[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpgk"
version = "1.1.0"
description = "A GTK3/VTE terminal emulator with AI integration"
requires-python = ">=3.10"
dependencies = [
    "PyGObject",
    "requests",
    "psutil",
]

[project.scripts]
tpgk = "tpgk.__main__:main"

[tool.setuptools.packages.find]
include = ["tpgk*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # Pyflakes
    "B",         # flake8-bugbear
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "I001", "F401", "F841", "E401"]
"tpgk/__main__.py" = ["E402", "E401"]
"tpgk/icons.py" = ["E402"]
"tpgk/settings_dialog.py" = ["E402", "F401", "F841", "F541"]
"tpgk/terminal.py" = ["E402"]
"tpgk/window.py" = ["E402"]
"tpgk/ai_client.py" = ["B904"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
