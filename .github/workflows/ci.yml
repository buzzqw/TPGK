name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python3-pip python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 xvfb

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run tests
        run: xvfb-run -a python3 -m pytest tests/ -v

      - name: Lint
        run: python3 -m ruff check tpgk/
