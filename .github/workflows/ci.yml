name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 xvfb

      - name: Install Python dependencies
        run: |
          python3 -m venv --system-site-packages .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: xvfb-run -a .venv-ci/bin/python -m pytest tests/ -v --cov=tpgk --cov-report=term-missing

      - name: Lint
        run: .venv-ci/bin/python -m ruff check .
