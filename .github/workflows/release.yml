name: Build AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release (es. v1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  APPIMAGETOOL_VERSION: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Determina tag
        id: tag
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_EVENT_TAG:-$MANUAL_TAG}"
          if [[ ! "$TAG" =~ ^v?[0-9]+([.][0-9]+){0,2}$ ]]; then
            echo "Tag non valido: $TAG" >&2
            exit 1
          fi
          printf 'value=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Versione
        id: ver
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          TAG="$RELEASE_TAG"
          VER="${TAG#v}"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VER" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libvte-2.91-dev \
            libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-vte-2.91 \
            gir1.2-pango-1.0 gir1.2-gdkpixbuf-2.0 \
            python3-gi python3-gi-cairo python3-pip \
            patchelf xvfb

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip wheel
          python3 -m pip install requests psutil pyinstaller

      - name: Build with PyInstaller
        run: |
          xvfb-run --auto-servernum \
            pyinstaller packaging/appimage/tpgk.spec --noconfirm

      - name: Create AppDir
        run: bash packaging/appimage/make-appdir.sh

      - name: Download appimagetool
        run: |
          wget -q \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool
          printf '%s  appimagetool\n' "$APPIMAGETOOL_SHA256" | sha256sum --check --strict
          ./appimagetool --appimage-extract
          mv squashfs-root appimagetool-extracted

      - name: Build AppImage
        id: build_appimage
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          APPIMAGE_NAME="TPGK-${VERSION}-x86_64.AppImage"
          ARCH=x86_64 appimagetool-extracted/AppRun \
            dist/tpgk.AppDir \
            "${APPIMAGE_NAME}"
          echo "name=${APPIMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify AppImage
        run: |
          ls -lh "${{ steps.build_appimage.outputs.name }}"
          file "${{ steps.build_appimage.outputs.name }}"

      - name: Upload AppImage to release
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ steps.build_appimage.outputs.name }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
